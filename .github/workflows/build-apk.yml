name: Build APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK (platform 36, build-tools, NDK 26.1, CMake)
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download runtime bundles (dist/runtime-bundles)
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-bundles
          base="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4"
          for f in \
            pocketdev-agy-arm64-2026.09.1.tar.zst \
            pocketdev-core-arm64-2026.09.5.tar.zst \
            pocketdev-claude-arm64-2026.09.1.tar.zst \
            pocketdev-python-arm64-2026.09.2.tar.zst \
            pocketdev-android-arm64-2026.09.1.tar.zst \
            pocketdev-dsh-arm64-2026.09.1.tar.zst; do
            curl -fL --retry 3 -o "dist/runtime-bundles/$f" "$base/$f"
          done
          ls -lh dist/runtime-bundles

      - name: Build debug APKs (online + offline)
        run: |
          ./gradlew --no-daemon :app:assembleOnlineDebug :app:assembleOfflineDebug

      - name: Upload online APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error

      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-offline-debug
          path: app/build/outputs/apk/offline/debug/*.apk
          if-no-files-found: error